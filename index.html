<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Car Eats Car 2 Deluxe</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #stage{position:fixed;inset:0}
  ruffle-player{width:100%;height:100%;display:block}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000d;color:#fff;font:600 18px system-ui,sans-serif;text-align:center;z-index:30;padding:24px}
  @media (orientation:portrait){#rotate{display:flex}}
  #bar{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:calc(6px + env(safe-area-inset-right,0px));display:flex;gap:6px;z-index:20}
  #bar button{width:40px;height:40px;border-radius:10px;border:0;background:#0007;color:#fff;font-size:18px}
  .pad{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:grid;gap:8px}
  #dpad{left:calc(14px + env(safe-area-inset-left,0px));grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px)}
  #acts{right:calc(14px + env(safe-area-inset-right,0px));grid-template-columns:repeat(2,64px)}
  .k{border:0;border-radius:50%;background:#ffffff38;color:#fff;font:700 20px system-ui,sans-serif;backdrop-filter:blur(2px);touch-action:none}
  .k.on{background:#ffffff80}
  #up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
  body.hidepad .pad{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <button id="btnPad" title="Кнопки">🎮</button>
  <button id="btnFs" title="Во весь экран">⛶</button>
</div>
<div id="dpad" class="pad">
  <button class="k" id="up" data-key="ArrowUp">▲</button>
  <button class="k" id="left" data-key="ArrowLeft">◀</button>
  <button class="k" id="down" data-key="ArrowDown">▼</button>
  <button class="k" id="right" data-key="ArrowRight">▶</button>
</div>
<div id="acts" class="pad">
  <button class="k" data-key="x">X</button>
  <button class="k" data-key="z">Z</button>
  <button class="k" data-key=" " style="grid-column:1/3;border-radius:32px">ПРОБЕЛ</button>
</div>
<div id="rotate">Поверните телефон горизонтально 📱↔️</div>

<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  publicPath: "./ruffle/",
  autoplay: "on",
  unmuteOverlay: "hidden",
  splashScreen: false,
  letterbox: "on",
  quality: "medium",
  warnOnUnsupportedContent: false,
  contextMenu: "off",
  backgroundColor: "#000000"
};
</script>
<script src="ruffle/ruffle.js"></script>
<script>
const ruffle = window.RufflePlayer.newest();
const player = ruffle.createPlayer();
document.getElementById("stage").appendChild(player);
player.load({ url: "game.swf" });

const CODES = {ArrowUp:["ArrowUp",38],ArrowDown:["ArrowDown",40],ArrowLeft:["ArrowLeft",37],ArrowRight:["ArrowRight",39],
  " ":["Space",32],x:["KeyX",88],z:["KeyZ",90]};
function fire(type,key){
  const [code,kc]=CODES[key];
  const ev=new KeyboardEvent(type,{key,code,keyCode:kc,which:kc,bubbles:true,cancelable:true});
  player.dispatchEvent(ev);
}
document.querySelectorAll(".k").forEach(b=>{
  const key=b.dataset.key;
  const down=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add("on");fire("keydown",key);if(navigator.vibrate)navigator.vibrate(8)};
  const up=e=>{e.preventDefault();b.classList.remove("on");fire("keyup",key)};
  b.addEventListener("pointerdown",down);
  b.addEventListener("pointerup",up);
  b.addEventListener("pointercancel",up);
  b.addEventListener("contextmenu",e=>e.preventDefault());
});
document.getElementById("btnPad").onclick=()=>document.body.classList.toggle("hidepad");
document.getElementById("btnFs").onclick=async()=>{
  try{
    if(document.fullscreenElement){await document.exitFullscreen();return}
    await document.documentElement.requestFullscreen();
    if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(()=>{});
  }catch(e){}
};
</script>
</body>
</html>
